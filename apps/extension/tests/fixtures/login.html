<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kryvex extension fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f4f6fc;
        color: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 12% 16%,
            rgba(79, 70, 229, 0.16),
            transparent 28%
          ),
          radial-gradient(
            circle at 88% 82%,
            rgba(14, 165, 233, 0.12),
            transparent 30%
          ),
          #f4f6fc;
      }
      main {
        width: min(440px, calc(100vw - 48px));
        padding: 36px;
        border: 1px solid #dce3f1;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(30, 41, 59, 0.13);
      }
      .eyebrow {
        margin: 0 0 10px;
        color: #4f46e5;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.03em;
      }
      .intro {
        margin: 10px 0 26px;
        color: #64748b;
        line-height: 1.6;
      }
      form {
        display: grid;
        gap: 18px;
      }
      label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
      }
      input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #c7d2e5;
        border-radius: 12px;
        color: #0f172a;
        background: #fff;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #818cf8;
        outline-offset: 2px;
      }
      button[type="submit"] {
        height: 48px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #4f46e5;
        font: inherit;
        font-weight: 750;
      }
      iframe,
      #add-spa-field {
        position: fixed;
        left: -10000px;
      }
      .notice {
        margin: 22px 0 0;
        color: #64748b;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Northstar Portal</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to continue to your private workspace.</p>
      <form id="login-form">
        <label
          >Email address <input autocomplete="username" type="email"
        /></label>
        <label
          >Password
          <input autocomplete="current-password" type="password" />
        </label>
        <button type="submit">Continue securely</button>
      </form>
      <p class="notice">
        Protected by your organization&apos;s security policy.
      </p>
    </main>
    <iframe title="untrusted frame" src="/framed.html"></iframe>
    <button id="add-spa-field" type="button">Add SPA form</button>
    <script>
      document
        .querySelector("#login-form")
        .addEventListener("submit", (event) => event.preventDefault());
      document.querySelector("#add-spa-field").addEventListener("click", () => {
        const form = document.createElement("form");
        const input = document.createElement("input");
        input.type = "password";
        input.autocomplete = "current-password";
        form.append(input);
        document.body.append(form);
      });
    </script>
  </body>
</html>
